services:
  postgres:
    image: postgres:17.0-alpine
  panel:
    image: ${OZAVO_IMAGE_PREFIX:-registro.example/projeto}/ozavo-panel:${OZAVO_VERSION:-stable}
    build: { context: .., target: panel }
  voice:
    image: ${OZAVO_IMAGE_PREFIX:-localhost}/ozavo-voz:${OZAVO_VERSION:-dev}
    build: { context: .., target: voice }
  routines:
    image: ${OZAVO_IMAGE_PREFIX:-localhost}/ozavo-routines:${OZAVO_VERSION:-dev}
    build: { context: .., target: routines }
